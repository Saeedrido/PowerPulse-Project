<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PowerPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Power<span>Pulse</span></div>
    <nav>
      <a href="/dashboard.html" class="active">Dashboard</a>
      <a href="/history.html">History</a>
      <a href="/setup.html">Setup</a>
      <a href="#" id="logout">Log out</a>
    </nav>
  </div>

  <div class="container">
    <h2 class="section-title">My Locations</h2>
    <div id="locations"></div>
    <div id="empty-state" class="empty" style="display:none">
      <div class="big">⚡</div>
      <p>No monitored locations yet.</p>
      <p><a class="btn mt" href="/setup.html" style="margin-top:16px">Add your first location</a></p>
    </div>

    <div class="grid-2 mt">
      <div class="card">
        <h3 class="section-title">🔔 Notifications</h3>
        <div id="notifications"><p class="muted">No notifications yet.</p></div>
      </div>
      <div class="card">
        <h3 class="section-title">🔗 IoT Simulator</h3>
        <p class="muted">Trigger power events from the simulator to see live updates here.</p>
        <a class="btn mt" href="/simulator/simulator.html" target="_blank">Open Simulator</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
