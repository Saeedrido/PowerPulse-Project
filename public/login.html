<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — PowerPulse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/clearwave.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <a class="nav-logo" href="/index.html">⚡ Power<span>Pulse</span></a>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Log in to check your power, anywhere.</p>
      <div class="error" id="err"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <div class="form-foot">New here? <a href="/register.html">Create an account</a></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (API.token) window.location.href = '/dashboard.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.classList.remove('show');
      try {
        const data = await API.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        API.setToken(data.token);
        window.location.href = '/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
      }
    });
  </script>
</body>
</html>
