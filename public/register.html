<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — PowerPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h1>Create your account</h1>
      <div class="error" id="err"></div>
      <form id="reg-form">
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="btn btn-block" type="submit">Create account</button>
      </form>
      <div class="form-foot">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (API.token) window.location.href = '/dashboard.html';

    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.classList.remove('show');
      try {
        const data = await API.post('/auth/register', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        API.setToken(data.token);
        window.location.href = '/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
      }
    });
  </script>
</body>
</html>
