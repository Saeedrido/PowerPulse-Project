<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — PowerPulse</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Power<span>Pulse</span></div>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/history.html">History</a>
      <a href="/setup.html" class="active">Setup</a>
      <a href="#" id="logout">Log out</a>
    </nav>
  </div>

  <div class="container">
    <div class="grid-2">
      <div class="card">
        <h3 class="section-title">Add a Location</h3>
        <div class="error" id="err-loc"></div>
        <form id="loc-form">
          <div class="form-group">
            <label for="loc-name">Location name</label>
            <input id="loc-name" placeholder="e.g. My Home" required>
          </div>
          <div class="form-group">
            <label for="loc-address">Address (optional)</label>
            <input id="loc-address" placeholder="e.g. 12 Main Street">
          </div>
          <button class="btn btn-block" type="submit">Create Location</button>
        </form>
      </div>

      <div class="card">
        <h3 class="section-title">Connect a Device</h3>
        <div class="error" id="err-dev"></div>
        <form id="dev-form">
          <div class="form-group">
            <label for="dev-code">Device code</label>
            <input id="dev-code" placeholder="e.g. PP-DEMO-0001" required>
          </div>
          <div class="form-group">
            <label for="dev-loc">Connect to location</label>
            <select id="dev-loc"></select>
          </div>
          <button class="btn btn-block" type="submit">Connect Device</button>
        </form>
        <p class="muted mt">The device code is printed on your PowerPulse IoT device (or shown on the simulator).</p>
      </div>
    </div>

    <div class="card mt">
      <h3 class="section-title">Your Devices</h3>
      <div id="devices-list"><p class="muted">Loading…</p></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/setup.js"></script>
</body>
</html>
